name: Build PSGallery Release

on:
  release:
    types: [ published ]

  workflow_dispatch:

jobs:
  publish_to_gallery:
    runs-on: ubuntu-latest
    environment: publish
    steps:
      - uses: actions/checkout@v4
      - name: Build and publish
        id: psgallery_publish
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
          BUILD_VERSION: ${{github.ref_name}}
        shell: pwsh
        run: |
          ./Build.ps1

          Set-Location ../
          Rename-Item -Path ./lm-powershell-module -NewName ./Logic.Monitor -Force
          Set-Location ./Logic.Monitor

          Publish-Module -path ./ -NuGetApiKey $env:NUGET_API_KEY -SkipAutomaticTags -Verbose

          Set-Location ../
          Rename-Item -Path ./Logic.Monitor -NewName ./lm-powershell-module -Force
          Set-Location ./lm-powershell-module

  push_to_slack:
    needs: publish_to_gallery
    runs-on: ubuntu-latest
    environment: publish
    continue-on-error: true
    steps:
      - name: Build Slack payload
        id: slack_payload
        shell: pwsh
        run: |
          function Convert-GitHubMarkdownLineToSlackMrkdwn {
              param(
                  [string]$Line,
                  [ref]$IsHeader
              )

              $IsHeader.Value = $false

              if ($Line -match '^\s*#{1,3}\s+(?<title>.+)$') {
                  $title = $Matches.title.Trim()
                  if ($title -eq 'Change List') {
                      return $null
                  }

                  $IsHeader.Value = $true
                  return "*$title*"
              }

              return [regex]::Replace($Line, '\*\*(?<text>[^*]+)\*\*', '*${text}*')
          }

          function ConvertTo-SlackMrkdwn {
              param([string]$Text)

              if ([string]::IsNullOrWhiteSpace($Text)) {
                  return '_No release notes provided._'
              }

              $normalized = $Text -replace "`r`n", "`n" -replace "`r", "`n"
              $output = [System.Collections.Generic.List[string]]::new()

              foreach ($line in ($normalized -split "`n")) {
                  $isHeader = $false
                  $converted = Convert-GitHubMarkdownLineToSlackMrkdwn -Line $line -IsHeader ([ref]$isHeader)
                  if ($null -eq $converted) {
                      continue
                  }

                  if ($isHeader -and $output.Count -gt 0 -and -not [string]::IsNullOrWhiteSpace($output[$output.Count - 1])) {
                      $output.Add('')
                  }

                  $output.Add($converted)
              }

              $result = ($output -join "`n").Trim()
              $escaped = $result -replace '&', '&amp;' -replace '<', '&lt;' -replace '>', '&gt;'

              if ($escaped.Length -gt 2900) {
                  return ($escaped.Substring(0, 2897) + '...')
              }

              return $escaped
          }

          function Get-SlackReleaseNoteBlocks {
              param([string]$Text)

              if ([string]::IsNullOrWhiteSpace($Text)) {
                  return @(
                      [ordered]@{
                          type = 'section'
                          text = [ordered]@{
                              type = 'mrkdwn'
                              text = '_No release notes provided._'
                          }
                      }
                  )
              }

              $normalized = $Text -replace "`r`n", "`n" -replace "`r", "`n"
              $sections = [System.Collections.Generic.List[string]]::new()
              $current = [System.Collections.Generic.List[string]]::new()

              foreach ($line in ($normalized -split "`n")) {
                  $isHeader = $false
                  $converted = Convert-GitHubMarkdownLineToSlackMrkdwn -Line $line -IsHeader ([ref]$isHeader)
                  if ($null -eq $converted) {
                      continue
                  }

                  if ($isHeader -and $current.Count -gt 0) {
                      $sections.Add(($current -join "`n").Trim())
                      $current.Clear()
                  }

                  $current.Add($converted)
              }

              if ($current.Count -gt 0) {
                  $sections.Add(($current -join "`n").Trim())
              }

              $blocks = [System.Collections.Generic.List[object]]::new()
              foreach ($sectionText in $sections) {
                  $escaped = $sectionText -replace '&', '&amp;' -replace '<', '&lt;' -replace '>', '&gt;'
                  if ($escaped.Length -gt 2900) {
                      $escaped = $escaped.Substring(0, 2897) + '...'
                  }

                  $blocks.Add([ordered]@{
                      type = 'section'
                      text = [ordered]@{
                          type = 'mrkdwn'
                          text = $escaped
                      }
                  })
              }

              if ($blocks.Count -eq 0) {
                  $blocks.Add([ordered]@{
                      type = 'section'
                      text = [ordered]@{
                          type = 'mrkdwn'
                          text = '_No release notes provided._'
                      }
                  })
              }

              return $blocks
          }

          $event = Get-Content -Raw $env:GITHUB_EVENT_PATH | ConvertFrom-Json
          $release = $event.release

          if ($null -eq $release) {
              $tagName = $env:GITHUB_REF_NAME
              $publishedAt = (Get-Date).ToString('o')
              $releaseNoteBlocks = Get-SlackReleaseNoteBlocks -Text '_Release metadata was not available for this workflow run._'
          }
          else {
              $tagName = [string]$release.tag_name
              $publishedAt = [string]$release.published_at
              $releaseNoteBlocks = Get-SlackReleaseNoteBlocks -Text ([string]$release.body)
          }

          $blocks = [System.Collections.Generic.List[object]]::new()
          $blocks.Add([ordered]@{
              type = 'header'
              text = [ordered]@{
                  type  = 'plain_text'
                  text  = ":party-lm-bug: Logic.Monitor PowerShell Module Release ($tagName) :party-lm-bug:"
                  emoji = $true
              }
          })
          $blocks.Add([ordered]@{
              type = 'context'
              elements = @(
                  [ordered]@{
                      type = 'mrkdwn'
                      text = "*$publishedAt* | Logic.Monitor Update Announcements"
                  }
              )
          })
          $blocks.Add([ordered]@{ type = 'divider' })
          $blocks.Add([ordered]@{
              type = 'header'
              text = [ordered]@{
                  type  = 'plain_text'
                  text  = ':powershell-core: Release Notes :powershell-core:'
                  emoji = $true
              }
          })
          foreach ($releaseNoteBlock in $releaseNoteBlocks) {
              $blocks.Add($releaseNoteBlock)
          }
          $blocks.Add([ordered]@{ type = 'divider' })
          $blocks.Add([ordered]@{
              type = 'section'
              text = [ordered]@{
                  type = 'mrkdwn'
                  text = '*Logic.Monitor* Release Notes'
              }
              accessory = [ordered]@{
                  type      = 'button'
                  text      = [ordered]@{ type = 'plain_text'; text = 'Release Notes'; emoji = $true }
                  url       = 'https://github.com/logicmonitor/lm-powershell-module/releases'
                  action_id = 'logicmonitor_release_notes'
              }
          })
          $blocks.Add([ordered]@{
              type = 'section'
              text = [ordered]@{
                  type = 'mrkdwn'
                  text = '*Logic.Monitor.SE* Toolkit Release Notes'
              }
              accessory = [ordered]@{
                  type      = 'button'
                  text      = [ordered]@{ type = 'plain_text'; text = 'Release Notes'; emoji = $true }
                  url       = 'https://github.com/logicmonitor/Logic.Monitor.SE/releases'
                  action_id = 'logicmonitor_se_release_notes'
              }
          })
          $blocks.Add([ordered]@{ type = 'divider' })
          $blocks.Add([ordered]@{
              type = 'header'
              text = [ordered]@{
                  type  = 'plain_text'
                  text  = ':rocket: How to get the latest version :rocket:'
                  emoji = $true
              }
          })
          $blocks.Add([ordered]@{
              type = 'section'
              text = [ordered]@{
                  type = 'mrkdwn'
                  text = '```Update-Module -Name Logic.Monitor -Force```'
              }
          })
          $blocks.Add([ordered]@{ type = 'divider' })
          $blocks.Add([ordered]@{
              type = 'context'
              elements = @(
                  [ordered]@{
                      type = 'mrkdwn'
                      text = ':pushpin: Do you have a feature request or bug report? <https://github.com/logicmonitor/lm-powershell-module/issues|Submit a GitHub Issue>.'
                  }
              )
          })

          $payload = [ordered]@{
              blocks = $blocks
          }

          $json = $payload | ConvertTo-Json -Depth 20 -Compress
          [System.IO.File]::WriteAllText("$PWD/slack-payload.json", $json, [System.Text.UTF8Encoding]::new($false))

          # Validate before sending to Slack.
          $null = Get-Content -Raw ./slack-payload.json | ConvertFrom-Json

      - name: Post release announcement to Slack
        uses: slackapi/slack-github-action@v2.1.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK }}
          webhook-type: incoming-webhook
          payload-file-path: ./slack-payload.json
